<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOTED — local-first Markdown notes</title>
  <meta name="description" content="NOTED — local-first Markdown notes in your browser. Works offline. Your data never leaves your device.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1b1d22">

  <link rel="stylesheet" href="css/style.css">

  <!-- CDN libraries. No build step: the source is the artifact. -->
  <script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.10/dist/dexie.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <!-- WYSIWYG "Write" mode (T35): the inverse of marked. turndown serializes the
       edited DOM back to Markdown; the gfm bundle adds tables, strikethrough,
       task lists and highlighted code so GFM survives the round-trip. -->
  <script defer src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
  <!-- Alpine is an ES module imported by js/ui/app.js, so components register
       before Alpine.start() runs. The UMD build auto-starts on its own microtask,
       before later <script type="module"> files execute. -->

  <!-- CodeMirror 6 arrives as ES modules through an import map — no bundler,
       consistent with the no-build-step rule. Every bare specifier in the
       @codemirror/@lezer graph is pinned here so each package resolves to a
       single shared module instance (duplicates would break editor state).
       ui/editor.js is the only file that imports any of these. -->
  <script type="importmap">
    {
      "imports": {
        "@codemirror/state": "https://cdn.jsdelivr.net/npm/@codemirror/state@6.7.6/dist/index.js",
        "@codemirror/view": "https://cdn.jsdelivr.net/npm/@codemirror/view@6.43.13/dist/index.js",
        "@codemirror/commands": "https://cdn.jsdelivr.net/npm/@codemirror/commands@6.11.1/dist/index.js",
        "@codemirror/language": "https://cdn.jsdelivr.net/npm/@codemirror/language@6.12.4/dist/index.js",
        "@codemirror/search": "https://cdn.jsdelivr.net/npm/@codemirror/search@6.7.2/dist/index.js",
        "@codemirror/lang-markdown": "https://cdn.jsdelivr.net/npm/@codemirror/lang-markdown@6.5.2/dist/index.js",
        "@codemirror/lang-html": "https://cdn.jsdelivr.net/npm/@codemirror/lang-html@6.4.12/dist/index.js",
        "@codemirror/lang-css": "https://cdn.jsdelivr.net/npm/@codemirror/lang-css@6.3.1/dist/index.js",
        "@codemirror/lang-javascript": "https://cdn.jsdelivr.net/npm/@codemirror/lang-javascript@6.2.5/dist/index.js",
        "@codemirror/autocomplete": "https://cdn.jsdelivr.net/npm/@codemirror/autocomplete@6.20.3/dist/index.js",
        "@lezer/common": "https://cdn.jsdelivr.net/npm/@lezer/common@1.5.2/dist/index.js",
        "@lezer/highlight": "https://cdn.jsdelivr.net/npm/@lezer/highlight@1.2.3/dist/index.js",
        "@lezer/lr": "https://cdn.jsdelivr.net/npm/@lezer/lr@1.4.10/dist/index.js",
        "@lezer/markdown": "https://cdn.jsdelivr.net/npm/@lezer/markdown@1.7.2/dist/index.js",
        "@lezer/html": "https://cdn.jsdelivr.net/npm/@lezer/html@1.3.13/dist/index.js",
        "@lezer/css": "https://cdn.jsdelivr.net/npm/@lezer/css@1.3.8/dist/index.js",
        "@lezer/javascript": "https://cdn.jsdelivr.net/npm/@lezer/javascript@1.5.5/dist/index.js",
        "style-mod": "https://cdn.jsdelivr.net/npm/style-mod@4.1.4/src/style-mod.js",
        "w3c-keyname": "https://cdn.jsdelivr.net/npm/w3c-keyname@2.2.8/index.js",
        "crelt": "https://cdn.jsdelivr.net/npm/crelt@1.0.7/index.js",
        "@marijn/find-cluster-break": "https://cdn.jsdelivr.net/npm/@marijn/find-cluster-break@1.0.4/src/index.js",
        "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
      }
    }
  </script>

  <!-- App modules -->
  <script type="module" src="js/ui/app.js"></script>
  <script type="module" src="js/pwa.js"></script>
</head>
<body>
  <div id="app" x-data="app" x-cloak>
    <header class="topbar">
      <a class="brand" href="#/">noted</a>
      <template x-if="route.name !== 'note' && route.name !== 'settings' && route.name !== 'folders'">
        <input class="search" type="search" x-model="query" placeholder="Search notes…" autocomplete="off" title="Search (Ctrl+K)">
      </template>
      <span class="offline-badge" x-show="!online" title="Offline — your notes are still saved locally">Offline</span>
      <span class="topbar-spacer"></span>
      <div class="topbar-actions">
        <template x-if="vault.enabled">
          <button type="button" class="btn" @click="vault.unlocked ? lockVault() : unlockVault()" :title="vault.unlocked ? 'Lock vault' : 'Unlock vault'" x-text="vault.unlocked ? '🔓' : '🔒'"></button>
        </template>
        <button type="button" class="btn" @click="triggerImport()" title="Import a backup file (merge: adds new, applies newer, never discards edits)">Import</button>
        <button type="button" class="btn" @click="exportAll()">Export</button>
        <button type="button" class="btn" @click="exportZip()" title="Export all notes as Markdown zip">Export .zip</button>
        <a class="btn" href="#/trash">Trash</a>
        <a class="btn" href="#/folders">Folders</a>
        <a class="btn" href="#/settings">Settings</a>
        <button type="button" class="btn primary" title="New note (Ctrl+N)" @click="newNote()">+ New</button>
      </div>
    </header>

    <main class="main">
      <!-- LIST + TAG views -->
      <template x-if="route.name === 'list' || route.name === 'tag'">
        <section class="list-view">
          <div class="list-header">
            <h1 class="view-title" x-show="route.name === 'tag'">
              Tagged <span class="tag-chip" x-text="'#' + route.params.tag"></span>
            </h1>
            <template x-if="route.name === 'list'">
              <div class="list-header-right">
                <p class="view-sub" x-show="!query && notes.length" x-text="notes.length + ' note' + (notes.length === 1 ? '' : 's')"></p>
                <select class="sort-select" x-model="sortBy" title="Sort notes">
                  <template x-for="opt in sortOptions" :key="opt.value">
                    <option :value="opt.value" x-text="opt.label"></option>
                  </template>
                </select>
              </div>
            </template>
          </div>

          <div class="empty" x-show="!visibleNotes.length">
            <template x-if="query.trim()"><span>No notes match your search.</span></template>
            <template x-if="!query.trim() && route.name === 'list'"><span>No notes yet — hit <strong>+ New</strong> to write your first one.</span></template>
            <template x-if="!query.trim() && route.name === 'tag'"><span>No notes with this tag.</span></template>
          </div>

          <div class="note-list">
            <template x-for="n in visibleNotes" :key="n.id">
              <article class="note-card" @click="open(n.id)">
                <div class="note-card-head">
                  <span class="note-title" x-text="n.title || 'Untitled'"></span>
                  <time class="note-date" x-text="fmtDate(n.updatedAt)"></time>
                  <button type="button" class="pin-btn" @click.stop="togglePin(n.id)" :class="{ pinned: n.pinned }" :title="n.pinned ? 'Unpin' : 'Pin'">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
                  </button>
                </div>
                <p class="note-excerpt" x-text="excerptOf(n)"></p>
                <div class="note-tags" x-show="n.tags.length">
                  <template x-for="t in n.tags" :key="t">
                    <a
                      class="tag-chip"
                      :href="'#/tag/' + encodeURIComponent(t)"
                      @click.stop
                      x-text="'#' + t"
                    ></a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- TRASH view -->
      <template x-if="route.name === 'trash'">
        <section class="list-view">
          <h1 class="view-title">Trash</h1>
          <p class="view-sub"><a href="#/">← Back to notes</a></p>

          <div class="empty" x-show="!visibleNotes.length">
            <template x-if="query.trim()"><span>No trashed notes match your search.</span></template>
            <template x-if="!query.trim()"><span>Trash is empty.</span></template>
          </div>

          <div class="note-list">
            <template x-for="n in visibleNotes" :key="n.id">
              <article class="note-card trash-card">
                <div class="note-card-head">
                  <span class="note-title" x-text="n.title || 'Untitled'"></span>
                  <time class="note-date" x-text="'Deleted ' + fmtDate(n.deletedAt)"></time>
                </div>
                <p class="note-excerpt" x-text="excerptOf(n)"></p>
                <div class="note-card-actions">
                  <button type="button" class="btn tiny" @click="restore(n.id)">Restore</button>
                  <button type="button" class="btn tiny danger" @click="purge(n.id)">Delete forever</button>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- FOLDER view (T24) -->
      <template x-if="route.name === 'folder'">
        <section class="list-view">
          <h1 class="view-title" x-text="folderTitle()"></h1>
          <p class="view-sub"><a href="#/folders">← All folders</a></p>

          <div class="empty" x-show="!visibleNotes.length">
            <span>No notes in this folder.</span>
          </div>

          <div class="note-list">
            <template x-for="n in visibleNotes" :key="n.id">
              <article class="note-card" @click="open(n.id)">
                <div class="note-card-head">
                  <span class="note-title" x-text="n.title || 'Untitled'"></span>
                  <time class="note-date" x-text="fmtDate(n.updatedAt)"></time>
                  <button type="button" class="pin-btn" @click.stop="togglePin(n.id)" :class="{ pinned: n.pinned }" :title="n.pinned ? 'Unpin' : 'Pin'">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
                  </button>
                </div>
                <p class="note-excerpt" x-text="excerptOf(n)"></p>
                <div class="note-tags" x-show="n.tags.length">
                  <template x-for="t in n.tags" :key="t">
                    <a
                      class="tag-chip"
                      :href="'#/tag/' + encodeURIComponent(t)"
                      @click.stop
                      x-text="'#' + t"
                    ></a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- FOLDERS view (T24) -->
      <template x-if="route.name === 'folders'">
        <section class="list-view">
          <h1 class="view-title">Folders</h1>
          <p class="view-sub"><a href="#/">← Back to notes</a></p>

          <div class="folders">
            <template x-for="f in folders" :key="f.id">
              <div class="folder-row">
                <a class="folder-name" :href="'#/folder/' + f.id" x-text="f.name"></a>
                <span class="folder-count" x-text="folderCountLabel(f.id)"></span>
                <span class="folder-row-actions">
                  <button type="button" class="btn tiny" @click="renameFolder(f.id)">Rename</button>
                  <button type="button" class="btn tiny danger" @click="deleteFolder(f.id)">Delete</button>
                </span>
              </div>
            </template>
            <p class="view-sub" x-show="!folders.length">No folders yet — create one below.</p>
          </div>

          <button type="button" class="btn" @click="createFolder()">+ New folder</button>
        </section>
      </template>

      <!-- SETTINGS view (T23) -->
      <template x-if="route.name === 'settings'">
        <section class="list-view">
          <h1 class="view-title">Settings</h1>
          <p class="view-sub"><a href="#/">← Back to notes</a></p>

          <div class="settings">
            <label class="settings-row">
              <span>Theme</span>
              <select x-model="settings.theme" @change="applySettings()">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </label>

            <label class="settings-row">
              <span>Editor font size</span>
              <select x-model="settings.editorFontSize" @change="applySettings()">
                <option value="13">Small (13px)</option>
                <option value="15">Normal (15px)</option>
                <option value="17">Large (17px)</option>
              </select>
            </label>

            <label class="settings-row">
              <span>Open a note in</span>
              <select x-model="settings.defaultView" @change="applySettings()">
                <option value="edit">Edit (rendered)</option>
                <option value="code">Code (raw Markdown)</option>
              </select>
            </label>

            <div class="settings-row" x-show="storageUsage">
              <span>Storage used</span>
              <span class="settings-value">
                <template x-if="storageUsage">
                  <span x-text="formatBytes(storageUsage.usage) + ' of ' + formatBytes(storageUsage.quota)"></span>
                </template>
                <template x-if="!storageUsage"><span>navigator.storage.estimate() unavailable</span></template>
              </span>
            </div>

            <div class="settings-row">
              <span>Vault encryption</span>
              <span class="settings-value" x-text="vault.enabled ? (vault.unlocked ? 'Unlocked' : 'Locked') : 'Off'"></span>
            </div>
            <template x-if="!vault.enabled">
              <button type="button" class="btn" @click="enableEncryption()">Enable encryption…</button>
            </template>
            <template x-if="vault.enabled && !vault.unlocked">
              <button type="button" class="btn" @click="unlockVault()">Unlock vault…</button>
            </template>
            <template x-if="vault.enabled && vault.unlocked">
              <button type="button" class="btn" @click="lockVault()">Lock vault</button>
            </template>
            <template x-if="vault.enabled && vault.unlocked">
              <button type="button" class="btn danger" @click="disableEncryption()">Turn encryption off…</button>
            </template>

            <div class="settings-row">
              <span>Backup</span>
              <span class="settings-value">Topbar Import merges; restore replaces</span>
            </div>
            <button type="button" class="btn danger" @click="restoreBackup()">Restore backup file (replace)…</button>
          </div>
        </section>
      </template>

      <!-- EDITOR view -->
      <template x-if="route.name === 'note' && note">
        <section class="editor">
          <div class="editor-bar">
            <button type="button" class="btn" @click="goBack()">← Notes</button>
            <span class="save-state" x-text="saveLabel"></span>
            <span class="editor-bar-spacer"></span>
            <div class="mode-switch" role="group" aria-label="View mode">
              <button type="button" class="btn" :class="{ active: mode === 'edit' }" @click="setMode('edit')" title="Write in the rendered document (Ctrl+E)">Edit</button>
              <button type="button" class="btn" :class="{ active: mode === 'code' }" @click="setMode('code')" title="Edit the raw Markdown source (Ctrl+E)">Code</button>
            </div>
            <button type="button" class="btn" @click="exportMD()">.md</button>
            <button type="button" class="btn danger" @click="removeNote()">Delete</button>
          </div>

          <input
            class="title-input"
            x-model="note.title"
            @input="touch()"
            placeholder="Title"
            autocomplete="off"
          >
          <input
            class="tags-input"
            x-model="note.tagsInput"
            @input="touch()"
            placeholder="tags, separated, by, commas"
            autocomplete="off"
          >
          <select
            class="folder-select"
            x-model="note.folderId"
            @change="touch()"
            title="Folder"
            x-show="folders.length"
          >
            <option value="">No folder</option>
            <template x-for="f in folders" :key="f.id">
              <option :value="f.id" x-text="f.name"></option>
            </template>
          </select>

          <div class="md-toolbar" @mousedown.prevent>
            <button type="button" class="md-btn" @click="formatAction('bold')" title="Bold (Ctrl+B)"><strong>B</strong></button>
            <button type="button" class="md-btn" @click="formatAction('italic')" title="Italic (Ctrl+I)"><em>I</em></button>
            <button type="button" class="md-btn" @click="formatAction('strike')" title="Strikethrough"><s>S</s></button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" @click="formatAction('h1')" title="Heading 1">H1</button>
            <button type="button" class="md-btn" @click="formatAction('h2')" title="Heading 2">H2</button>
            <button type="button" class="md-btn" @click="formatAction('h3')" title="Heading 3">H3</button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" @click="formatAction('ul')" title="Bullet list">&bull; List</button>
            <button type="button" class="md-btn" @click="formatAction('ol')" title="Numbered list">1. List</button>
            <button type="button" class="md-btn" @click="formatAction('quote')" title="Blockquote">&gt; Quote</button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" @click="formatAction('code')" title="Inline code">&#96;Code&#96;</button>
            <button type="button" class="md-btn" @click="formatAction('codeblock')" title="Code block">{ }</button>
            <button type="button" class="md-btn" @click="formatAction('link')" title="Link">Link</button>
            <button type="button" class="md-btn" @click="formatAction('image')" title="Image">Image</button>
            <button type="button" class="md-btn" @click="formatAction('hr')" title="Horizontal rule">&mdash;</button>
          </div>

          <div class="editor-body" :class="mode">
            <div class="cm-host" x-show="mode === 'code'" x-init="mountEditor($el)"></div>
            <!-- Edit mode (T36): the rendered document is the editing surface.
                 It is mounted once alongside the source editor and stays hidden
                 in Code mode, so it survives note→note navigation. -->
            <div
              class="wysiwyg-host"
              x-show="mode === 'edit'"
              x-init="mountWysiwyg($el)"
            ></div>
          </div>

          <div class="attachments">
            <div class="attachments-head">
              <span x-text="'Attachments (' + attachments.length + ')'"></span>
              <button type="button" class="btn tiny" @click="triggerAttach()" title="Attach files (max 25MB each)">+ Attach</button>
            </div>
            <ul class="attachment-list" x-show="attachments.length">
              <template x-for="a in attachments" :key="a.id">
                <li class="attachment-row">
                  <button type="button" class="attachment-name" @click="downloadAttachment(a.id)" x-text="(a.enc ? '🔒 ' : '') + a.name"></button>
                  <span class="attachment-meta" x-text="formatBytes(a.size)"></span>
                  <button type="button" class="btn tiny danger" @click="removeAttachment(a.id)" title="Remove attachment">Remove</button>
                </li>
              </template>
            </ul>
          </div>
        </section>
      </template>

      <!-- NOT FOUND -->
      <template x-if="route.name === 'notfound'">
        <section class="empty">
          <p>That page doesn’t exist. <a href="#/">Back to your notes</a>.</p>
        </section>
      </template>
    </main>

    <input
      type="file"
      accept=".json,application/json"
      x-ref="importFile"
      @change="onImportFile($event)"
      hidden
    >
    <input type="file" x-ref="attachFile" @change="onAttachFiles($event)" multiple hidden>
  </div>
</body>
</html>
